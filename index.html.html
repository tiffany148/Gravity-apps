<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e1c"><meta name="apple-mobile-web-app-capable" content="yes"><title>Gravity & Glow · Crystal Gravity</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e1c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}body{background-image:radial-gradient(circle at 50% 36%,#27304c,#080e1c 70%);background-size:cover;background-position:center}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 15px #07101d}h1{font-size:22px;letter-spacing:.06em;margin:0;color:#bafaf1}header p{font-size:12px;margin:6px 0;color:#e6dbff}.controls{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:8px;right:8px;display:flex;justify-content:center;flex-wrap:wrap;gap:7px}button,.upload{border:1px solid #9a9fce88;border-radius:18px;background:#171c35d9;color:#fff;padding:10px 12px;font-size:12px;font-weight:650;backdrop-filter:blur(10px)}button.active{background:#89eee0;color:#112032}.upload input{display:none}#notice{position:fixed;top:calc(env(safe-area-inset-top) + 75px);left:10px;right:10px;text-align:center;color:#d7d1ee;font-size:12px;pointer-events:none}#editor{position:fixed;inset:0;background:#060918bb;display:none;align-items:center;justify-content:center;z-index:5;padding:20px}#editor.open{display:flex}.panel{background:#202541;border:1px solid #98d8df66;border-radius:18px;padding:20px;width:min(340px,100%);display:grid;gap:10px}.panel input{padding:12px;border-radius:10px;border:1px solid #a9b4d088;background:#11172d;color:white;font-size:16px}.panel label{font-size:13px;color:#d8e7f0}.panel .actions{display:flex;gap:10px}.panel button{flex:1}
</style></head><body><canvas id="c"></canvas><header><h1>✧ CRYSTAL GRAVITY ✧</h1><p>Catch a crystal. Flick it. Watch the magic.</p></header><div id="notice">Drag to toss · Long-press to edit</div><div class="controls"><button id="tilt">Enable Tilt</button><button id="float">Float Mode</button><button id="explode">✦ Crystal Burst</button><button id="reset">Reset</button><label class="upload">Wallpaper<input id="wallpaper" type="file" accept="image/*"></label><button id="clear">Clear BG</button></div><div id="editor"><div class="panel"><strong>Edit crystal shortcut</strong><label for="appname">Name</label><input id="appname" maxlength="18"><label for="applink">Web address or supported app link</label><input id="applink" placeholder="https://example.com"><div class="actions"><button id="cancel">Cancel</button><button id="save">Save</button></div></div></div><script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let w=0,h=0,dpr=1,particles=[],stars=[],selected=null,gesture=null,tilt=false,freeFloat=false,gx=0,gy=0,last=0,editTarget=null,bursts=[];const palette=['#80f5e7','#bca3ff','#ffc0dc','#d3f4ff'];const names=['Music','Photos','Safari','Messages','Camera','Notes','Maps','Mail','Calendar','Weather','Files','Clock','Reminders','Shortcuts','Podcasts','Books','Settings','Contacts','Store','Home'];let saved=[];try{saved=JSON.parse(localStorage.getItem('crystal-gravity-shortcuts')||'[]')}catch{}const items=names.map((name,i)=>({name:saved[i]?.name||name,url:saved[i]?.url||'',color:palette[i%4]}));function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!particles.length)reset();}function reset(){particles=items.map((item,i)=>({item,x:30+Math.random()*Math.max(1,w-60),y:110+Math.random()*Math.max(1,h*.35),vx:(Math.random()-.5)*2,vy:0,r:15+(i%4===0?2:0),trail:[],held:false}));}function rgb(hex){return [1,3,5].map(k=>parseInt(hex.slice(k,k+2),16))}function rgba(hex,a){return `rgba(${rgb(hex).join(',')},${a})`}function gem(b,t){const {x,y,r,item}=b;ctx.save();ctx.shadowColor=item.color;ctx.shadowBlur=15;let g=ctx.createRadialGradient(x-r*.38,y-r*.42,1,x,y,r);g.addColorStop(0,'rgba(255,255,255,.96)');g.addColorStop(.24,rgba(item.color,.87));g.addColorStop(.75,rgba(item.color,.48));g.addColorStop(1,rgba(item.color,.82));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=.9;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.ellipse(x-r*.27,y-r*.4,r*.36,r*.15,-.45,0,Math.PI*2);ctx.fill();if(Math.sin(t*.003+b.x*.2)> .96){ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+r*.5-4,y-r*.6);ctx.lineTo(x+r*.5+4,y-r*.6);ctx.moveTo(x+r*.5,y-r*.6-4);ctx.lineTo(x+r*.5,y-r*.6+4);ctx.stroke()}ctx.fillStyle='#152039';ctx.font=`bold ${Math.max(10,r*.75)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(item.name.slice(0,1).toUpperCase(),x,y+1);ctx.font='10px system-ui';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText(item.name,x,y+r+13);ctx.restore();}function trails(b){for(let i=1;i<b.trail.length;i++){let a=b.trail[i-1],p=b.trail[i],alpha=i/b.trail.length*.38;ctx.strokeStyle=rgba(b.item.color,alpha);ctx.lineWidth=Math.max(.5,2*i/b.trail.length);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.stroke();if(i%3===0){ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fillRect(p.x+Math.sin(i)*3,p.y+Math.cos(i)*3,1.5,1.5)}}}function physics(dt,t){const floor=h-85;for(let b of particles){if(!b.held){b.vx+=(freeFloat?0:gx)*dt;b.vy+=(freeFloat?-.035:.18+gy)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.997,dt);b.vy*=Math.pow(.998,dt);if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.78}if(b.x>w-b.r){b.x=w-b.r;b.vx=-Math.abs(b.vx)*.78}if(b.y<105+b.r){b.y=105+b.r;b.vy=Math.abs(b.vy)*.76}if(b.y>floor-b.r){b.y=floor-b.r;b.vy=-Math.abs(b.vy)*.7;b.vx*=.985}}b.trail.push({x:b.x,y:b.y});if(b.trail.length>12)b.trail.shift()}for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){let a=particles[i],b=particles[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,overlap=a.r+b.r-dist;if(overlap>0){let nx=dx/dist,ny=dy/dist;if(!a.held){a.x-=nx*overlap*.5;a.y-=ny*overlap*.5}if(!b.held){b.x+=nx*overlap*.5;b.y+=ny*overlap*.5}let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let impulse=-rel*.78;if(!a.held){a.vx-=impulse*nx;a.vy-=impulse*ny}if(!b.held){b.vx+=impulse*nx;b.vy+=impulse*ny}}}}for(let b of particles)trails(b);for(let b of particles)gem(b,t)}function burst(){const cx=w/2,cy=h*.46;particles.forEach((b,i)=>{const a=Math.atan2(b.y-cy,b.x-cx)+(Math.random()-.5)*.7;const force=7+Math.random()*7;b.vx=Math.cos(a)*force;b.vy=Math.sin(a)*force-2;b.held=false;for(let j=0;j<9;j++){const theta=Math.random()*Math.PI*2;const v=1+Math.random()*5;bursts.push({x:b.x,y:b.y,vx:Math.cos(theta)*v,vy:Math.sin(theta)*v,life:35+Math.random()*30,max:65,color:b.item.color})}});$('notice').textContent='Crystal burst! Flick the gems to play again'}function drawBursts(dt){for(let i=bursts.length-1;i>=0;i--){const p=bursts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.04*dt;p.vx*=.99;p.life-=dt;if(p.life<=0){bursts.splice(i,1);continue}ctx.save();ctx.globalAlpha=Math.min(1,p.life/28);ctx.fillStyle=i%3===0?'#fff':p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,2*p.life/p.max),0,Math.PI*2);ctx.fill();ctx.restore()}}function frame(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;ctx.clearRect(0,0,w,h);for(let i=0;i<28;i++){let x=(i*123.7)%w,y=105+(i*91.3)%Math.max(1,h-210);ctx.fillStyle=`rgba(245,240,255,${.16+.12*Math.sin(t*.001+i)})`;ctx.fillRect(x,y,1.4,1.4)}physics(dt,t);drawBursts(dt);requestAnimationFrame(frame)}function locate(e){return{x:e.clientX,y:e.clientY}}function hit(p){return [...particles].reverse().find(b=>Math.hypot(p.x-b.x,p.y-b.y)<b.r+9)}let pressTimer=null;function edit(b){editTarget=b;$('appname').value=b.item.name;$('applink').value=b.item.url;$('editor').classList.add('open');}c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);let p=locate(e),b=hit(p);gesture={p,start:p,at:performance.now(),b,moved:false};if(b){b.held=true;pressTimer=setTimeout(()=>{if(gesture&&!gesture.moved){b.held=false;gesture=null;edit(b)}},650)}});c.addEventListener('pointermove',e=>{if(!gesture)return;let p=locate(e),dx=p.x-gesture.p.x,dy=p.y-gesture.p.y;if(Math.hypot(p.x-gesture.start.x,p.y-gesture.start.y)>9){gesture.moved=true;clearTimeout(pressTimer)}if(gesture.b){let b=gesture.b;b.x=p.x;b.y=p.y;b.vx=dx*.85;b.vy=dy*.85}gesture.p=p});function end(){clearTimeout(pressTimer);if(!gesture)return;let {b,moved,at}=gesture;if(b){b.held=false;if(!moved&&performance.now()-at<500&&b.item.url){const url=b.item.url;if(/^https?:\/\//i.test(url)||/^[a-z][a-z0-9+.-]*:\/\//i.test(url))location.href=url;else $('notice').textContent='Edit shortcut: enter a full URL'}}gesture=null}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);$('explode').onclick=burst;$('reset').onclick=()=>{bursts=[];reset()};$('float').onclick=()=>{freeFloat=!freeFloat;$('float').classList.toggle('active',freeFloat)};$('tilt').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined')throw Error('Unavailable');if(typeof DeviceOrientationEvent.requestPermission==='function'){let result=await DeviceOrientationEvent.requestPermission();if(result!=='granted')throw Error('Denied')}tilt=true;$('tilt').classList.add('active');$('notice').textContent='Tilt to move the crystals'}catch{$('notice').textContent='Motion unavailable or permission denied'}};window.addEventListener('deviceorientation',e=>{if(!tilt)return;gx=Math.max(-.32,Math.min(.32,(e.gamma||0)/95));gy=Math.max(-.14,Math.min(.14,(e.beta||0)/280))});$('wallpaper').onchange=e=>{let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{document.body.style.backgroundImage=`linear-gradient(#08102044,#08102044),url(${reader.result})`};reader.readAsDataURL(file)};$('clear').onclick=()=>{document.body.style.backgroundImage='radial-gradient(circle at 50% 36%,#27304c,#080e1c 70%)'};$('cancel').onclick=()=>$('editor').classList.remove('open');$('save').onclick=()=>{if(!editTarget)return;editTarget.item.name=$('appname').value.trim()||'App';editTarget.item.url=$('applink').value.trim();try{localStorage.setItem('crystal-gravity-shortcuts',JSON.stringify(items.map(x=>({name:x.name,url:x.url}))))}catch{}$('editor').classList.remove('open')};addEventListener('resize',resize);resize();requestAnimationFrame(frame)})();
</script></body></html>
